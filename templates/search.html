<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xinon Social — Search</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header class="top-bar">
<div class="top-logo">
                XN
            </div>
<div class="top-actions">
<button class="icon-button" id="searchButton" title="Search" type="button">
                    🔍
                </button>
<button class="icon-button" id="notificationsButton" title="Notifications" type="button">
                    🔔
                </button>
</div>
</header><section class="media-view" id="searchView">
<main class="feed utility-feed">
<section class="utility-card">
<div class="utility-header">
<button class="utility-back-button" data-back-view="homeView" type="button">←</button>
<div>
<h2>Search</h2>
<p>Find people, channels and posts on Xinon.</p>
</div>
</div>
<form class="search-form" id="searchForm">
<input autocomplete="off" id="searchInput" placeholder="Search Xinon..." type="search"/>
<button type="submit">Search</button>
</form>
<div class="utility-results" id="searchResults">
<div class="utility-empty">
<div>🔎</div>
<strong>Search Xinon</strong>
<p>Enter a name, username or channel name to search.</p>
</div>
</div>
</section>
</main>
</section><nav class="bottom-nav">
<button class="nav-button active" data-view="homeView" type="button">
<span class="nav-icon">
                    🏠
                </span>

                Home

            </button>
<button class="nav-button" data-view="reelsView" type="button">
<span class="nav-icon">
                    🎬
                </span>

                Reels

            </button>
<button class="nav-button" data-view="profileView" type="button">
<span class="nav-icon">
                    👤
                </span>

                Profile

            </button>
</nav><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
