{% extends "base.html" %}
{% block title %}Search - Xinon Social{% endblock %}
{% block content %}
<section class="media-view" id="searchView">
<main class="feed utility-feed">
<section class="utility-card">
<div class="utility-header">
<button class="utility-back-button" data-back-view="homeView" onclick="xinonOpenMediaView('homeView')" type="button">←</button>
<div>
<h2>Search</h2>
<p>Find people, channels and posts on Xinon.</p>
</div>
</div>
<form class="search-form" id="searchForm">
<input autocomplete="off" id="searchInput" placeholder="Search Xinon..." type="search"/>
<button type="submit">Search</button>
</form>
<div class="utility-results" id="searchResults">
<div class="utility-empty">
<div>🔎</div>
<strong>Search Xinon</strong>
<p>Enter a name, username or channel name to search.</p>
</div>
</div>
</section>
</main>
</section>
{% endblock %}
