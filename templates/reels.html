{% extends "base.html" %}
{% block title %}Reels - Xinon Social{% endblock %}
{% block content %}
<section class="media-view" id="reelsView">
<main class="reels-feed">
<article class="reel-card">
<div class="video-box">
<div class="video-placeholder">
<div class="play">
                                ▶
                            </div>
<div class="video-label">
                                Video / Reel
                            </div>
</div>
</div>
<div class="reel-info">
<div class="reel-user">
                            @username
                        </div>
<div class="reel-caption">
                            This is a video caption for Xinon Social.
                        </div>
</div>
<div class="reel-actions">
<div class="reaction-menu hidden" data-reaction-menu="">
<button class="reaction" data-reaction="😂" title="Haha" type="button">
                                😂
                            </button>
<button class="reaction" data-reaction="😢" title="Sad" type="button">
                                😢
                            </button>
<button class="reaction" data-reaction="😮" title="Wow" type="button">
                                😮
                            </button>
<button class="reaction" data-reaction="🥰" title="Cute" type="button">
                                🥰
                            </button>
<button class="reaction" data-reaction="❤️" title="Love" type="button">
                                ❤️
                            </button>
<button class="reaction" data-reaction="😡" title="Angry" type="button">
                                😡
                            </button>
</div>
<button class="reel-action like-button" type="button">
                            👍 Like
                        </button>
<button class="reel-action comment-button" type="button">
                            💬 Comment
                        </button>
<button class="reel-action share-button" id="shareButton1" type="button">
                            ↗️ Share
                        </button>
</div>
<div class="comment-box">
<input class="comment-input" placeholder="Write a comment..." type="text"/>
<button class="comment-send" type="button">
                            Send
                        </button>
</div>
</article>
<article class="reel-card">
<div class="video-box">
<div class="video-placeholder">
<div class="play">
                                ▶
                            </div>
<div class="video-label">
                                Video / Reel
                            </div>
</div>
</div>
<div class="reel-info">
<div class="reel-user">
                            @another_user
                        </div>
<div class="reel-caption">
                            Another video can appear here with its caption.
                        </div>
</div>
<div class="reel-actions">
<div class="reaction-menu hidden" data-reaction-menu="">
<button class="reaction" data-reaction="😂" title="Haha" type="button">😂</button>
<button class="reaction" data-reaction="😢" title="Sad" type="button">😢</button>
<button class="reaction" data-reaction="😮" title="Wow" type="button">😮</button>
<button class="reaction" data-reaction="🥰" title="Cute" type="button">🥰</button>
<button class="reaction" data-reaction="❤️" title="Love" type="button">❤️</button>
<button class="reaction" data-reaction="😡" title="Angry" type="button">😡</button>
</div>
<button class="reel-action like-button" type="button">
                            👍 Like
                        </button>
<button class="reel-action comment-button" type="button">
                            💬 Comment
                        </button>
<button class="reel-action share-button" id="shareButton2" type="button">
                            ↗️ Share
                        </button>
</div>
<div class="comment-box">
<input class="comment-input" placeholder="Write a comment..." type="text"/>
<button class="comment-send" type="button">
                            Send
                        </button>
</div>
</article>
</main>
</section>
{% endblock %}
