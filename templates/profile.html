<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Xinon Social — Profile</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><header class="top-bar">
<div class="top-logo">XN</div>
<div class="top-actions">
<button class="icon-button" id="searchButton" title="Search" type="button">🔍</button>
<button class="icon-button" id="notificationsButton" title="Notifications" type="button">🔔</button>
</div></header>
<section class="media-view" id="profileView"><main class="feed">
<section class="profile-card-xinon">
<div class="cover-photo"><div class="cover-edit">✏️ Edit cover</div></div>
<div class="profile-main">
<div class="profile-avatar-large" id="profileAvatarLarge">U<button class="avatar-edit" id="avatarEditButton" title="Change profile photo" type="button">📷</button></div>
<input id="profilePictureInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<div class="profile-name-row"><div><h2 id="profileName">Loading...</h2><p id="profileUsername">@username</p></div><button class="edit-profile-button" type="button">Edit profile</button></div>
<p class="profile-bio" id="profileBio">Your bio will appear here.</p>
<div class="profile-details"><span>📍 Add location</span><span>🔗 Add website</span><span>📅 Joined Xinon</span></div>
<div class="profile-tabs"><button class="profile-tab active" type="button">Posts</button><button class="profile-tab" type="button">About</button><button class="profile-tab" type="button">Friends</button><button class="profile-tab" type="button">Photos</button></div>
<p class="utility-message" id="profilePictureResult"></p>
</div></section>
<section class="profile-grid"><div>
<section class="profile-card-small"><h3>Intro</h3><p id="introBio">Your bio will appear here.</p><button class="outline-button" type="button">Edit details</button></section>
<section class="profile-card-small"><div class="section-title-row"><h3>Photos</h3><button class="text-button" type="button">See all</button></div><div class="photo-grid"><div class="photo-placeholder">📷</div><div class="photo-placeholder">📷</div><div class="photo-placeholder">📷</div><div class="photo-placeholder">📷</div></div></section>
</div><div><section class="profile-card-small"><div class="section-title-row"><h3>Posts</h3><button class="text-button" type="button">Manage posts</button></div><div class="profile-posts-empty" id="profilePosts"><div>📰</div><p>Your posts will appear here.</p></div></section></div></section>
<section class="profile-card-small account-section"><h3>Account</h3><button class="settings-row" id="openChannelButton" type="button"><span class="settings-icon">📣</span><span><strong>Create a Channel</strong><small>Create a public or private Xinon Channel</small></span><span>›</span></button><div class="profile-channel-list" id="myChannels"></div><button class="settings-row" id="openSettingsButton" type="button"><span class="settings-icon">⚙️</span><span><strong>Settings &amp; privacy</strong><small>Manage your Xinon account and privacy</small></span><span>›</span></button><button class="logout-button" id="logoutButton" type="button">Log out</button></section>
</main></section><nav class="bottom-nav"><button class="nav-button" data-view="homeView" type="button"><span class="nav-icon">🏠</span>Home</button><button class="nav-button" data-view="reelsView" type="button"><span class="nav-icon">🎬</span>Reels</button><button class="nav-button active" data-view="profileView" type="button"><span class="nav-icon">👤</span>Profile</button></nav><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
