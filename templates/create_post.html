<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Post</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body>
<header class="topbar"><button class="circle-btn" type="button" onclick="history.back()">←</button><strong>Create post</strong><span></span></header>
<main class="feed"><section class="composer-page"><textarea id="postTextInput" placeholder="What's on your mind?"></textarea><div id="preview" class="media-preview"></div><div class="composer-actions"><button id="choosePhoto" type="button">📷 Photo</button><button id="chooseVideo" type="button">🎥 Video</button></div><input id="mediaInput" type="file" accept="image/*,video/*" hidden><button id="publishPostButton" class="publish" type="button">Publish Post</button><p id="result"></p></section></main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
