<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Xinon Social{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="media-page">
<header class="top-bar">
<div class="top-logo">
                XN
            </div>
<div class="top-actions">
<button class="icon-button" id="searchButton" onclick="xinonOpenMediaView('searchView')" title="Search" type="button">
                    🔍
                </button>
<button class="icon-button" id="notificationsButton" onclick="xinonOpenMediaView('notificationsView')" title="Notifications" type="button">
                    🔔
                </button>
</div>
</header>
{% block content %}{% endblock %}
<nav class="bottom-nav">
<button class="nav-button active" data-view="homeView" type="button">
<span class="nav-icon">
                    🏠
                </span>

                Home

            </button>
<button class="nav-button" data-view="reelsView" type="button">
<span class="nav-icon">
                    🎬
                </span>

                Reels

            </button>
<button class="nav-button" data-view="profileView" type="button">
<span class="nav-icon">
                    👤
                </span>

                Profile

            </button>
</nav>
</div>
<script src="{{ url_for('static', filename='js/social.js') }}"></script>
{% block page_script %}{% endblock %}
</body>
</html>
