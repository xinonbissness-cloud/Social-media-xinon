{% extends "base.html" %}
{% block title %}Home - Xinon Social{% endblock %}
{% block content %}
<section class="media-view" id="homeView">
<main class="feed">
<section class="create-post">
<div class="create-post-top">
<div class="avatar">
                            U
                        </div>
<button class="post-input" id="openPostComposerButton" onclick="xinonOpenComposer('text')" type="button">
                            What's on your mind?
                        </button>
</div>
<div class="post-actions">
<button class="post-action" id="photoPostButton" onclick="xinonOpenComposer('photo')" type="button">
                            📷 Photo
                        </button>
<button class="post-action" id="videoPostButton" onclick="xinonOpenComposer('video')" type="button">
                            🎥 Video
                        </button>
<button class="post-action" id="textPostButton" onclick="xinonOpenComposer('text')" type="button">
                            ✍️ Post
                        </button>
</div>
</section>
<section class="empty-feed">
<div class="empty-feed-icon">
                        📰
                    </div>
<h3>
                        Your feed is empty
                    </h3>
<p>
                        Posts from people you follow
                        will appear here.
                    </p>
</section>
</main>
</section>
{% endblock %}
