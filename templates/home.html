<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xinon Social — Home</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top-bar">
    <div class="top-logo">XN</div>
    <div class="top-actions">
        <button class="icon-button" id="searchButton" title="Search" type="button">🔍</button>
        <button class="icon-button" id="notificationsButton" title="Notifications" type="button">🔔</button>
    </div>
</header>

<section class="media-view" id="homeView">
<main class="feed">
    <section class="create-post">
        <div class="create-post-top">
            <div class="avatar">U</div>
            <button class="post-input" id="openPostComposerButton" type="button">What's on your mind?</button>
        </div>
        <div class="post-actions">
            <button class="post-action" id="photoPostButton" type="button">📷 Photo</button>
            <button class="post-action" id="videoPostButton" type="button">🎥 Video</button>
            <button class="post-action" id="textPostButton" type="button">✍️ Post</button>
        </div>
    </section>

    <section id="feedPosts" class="feed-posts">
        <div class="empty-feed" id="emptyFeed">
            <div class="empty-feed-icon">📰</div>
            <h3>Your feed is empty</h3>
            <p>Posts from people you follow will appear here.</p>
        </div>
    </section>
</main>
</section>

<nav class="bottom-nav">
    <button class="nav-button active" data-view="homeView" type="button"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-button" data-view="reelsView" type="button"><span class="nav-icon">🎬</span>Reels</button>
    <button class="nav-button" data-view="profileView" type="button"><span class="nav-icon">👤</span>Profile</button>
</nav>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
