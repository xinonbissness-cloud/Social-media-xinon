{% extends "base.html" %}
{% block title %}Settings - Xinon Social{% endblock %}
{% block content %}
<section class="media-view" id="settingsView">
<main class="feed settings-feed">
<section class="settings-header">
<button class="back-settings-button" id="backToProfileButton" type="button">‹</button>
<div>
<h2>Settings &amp; privacy</h2>
<p>Manage your Xinon experience</p>
</div>
</section>
<section class="settings-card">
<h3>Account</h3>
<button class="settings-row" type="button">
<span class="settings-icon">👤</span>
<span><strong>Personal information</strong><small>Name, birthday, gender</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">🔐</span>
<span><strong>Password and security</strong><small>Password, login sessions and security</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">✉️</span>
<span><strong>Email</strong><small>Manage your email address</small></span>
<span>›</span>
</button>
</section>
<section class="settings-card">
<h3>Privacy</h3>
<button class="settings-row" type="button">
<span class="settings-icon">🔒</span>
<span><strong>Privacy settings</strong><small>Choose who can see your content</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">🚫</span>
<span><strong>Blocking</strong><small>Manage blocked users</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">📝</span>
<span><strong>Activity log</strong><small>Review your activity on Xinon</small></span>
<span>›</span>
</button>
</section>
<section class="settings-card">
<h3>Notifications</h3>
<button class="settings-row" type="button">
<span class="settings-icon">🔔</span>
<span><strong>Notification settings</strong><small>Likes, comments, messages and more</small></span>
<span>›</span>
</button>
</section>
<section class="settings-card">
<h3>Content &amp; preferences</h3>
<button class="settings-row" type="button">
<span class="settings-icon">📰</span>
<span><strong>Feed preferences</strong><small>Control what appears in your feed</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">🌐</span>
<span><strong>Language</strong><small>Choose your language</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">▶️</span>
<span><strong>Media settings</strong><small>Video autoplay and media preferences</small></span>
<span>›</span>
</button>
</section>
<section class="settings-card">
<h3>Xinon</h3>
<button class="settings-row" type="button">
<span class="settings-icon">📄</span>
<span><strong>Terms &amp; policies</strong><small>Terms, privacy policy and community rules</small></span>
<span>›</span>
</button>
<button class="settings-row" type="button">
<span class="settings-icon">❓</span>
<span><strong>Help &amp; support</strong><small>Get help with Xinon</small></span>
<span>›</span>
</button>
<button class="settings-row danger-row" type="button">
<span class="settings-icon">🗑️</span>
<span><strong>Delete or deactivate account</strong><small>Temporarily deactivate or permanently delete</small></span>
<span>›</span>
</button>
</section>
</main>
</section>
{% endblock %}
