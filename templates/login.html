<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Xinon Social</title><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/></head><body><div class="page" id="loginPage">
<div class="container">
<div class="xn-logo">
                XN
            </div>
<div class="auth-box">
<h2>
                    Log in to Xinon
                </h2>
<form id="loginForm">
<input id="loginEmail" placeholder="Email" required="" type="email"/>
<input id="loginPassword" placeholder="Password" required="" type="password"/>
<button class="login-button" type="submit">
                        Log In
                    </button>
</form>
<a class="forgot" href="#" onclick="return false;">
                    Forgot password?
                </a>
<hr class="divider"/>
<div class="switch-text">

                    Don't have an account?

                    <button class="link-button" id="showRegisterButton" type="button">
                        Create account
                    </button>
</div>
<p class="result" id="loginResult"></p>
</div>
</div>
</div><div class="page hidden" id="registerPage">
<div class="container">
<div class="xn-logo">
                XN
            </div>
<div class="auth-box register-box">
<h2>
                    Create a new account
                </h2>
<form id="registerForm">
<input id="name" placeholder="Name" required="" type="text"/>
<input id="birthday" required="" type="date"/>
<select id="gender" required="">
<option value="">
                            Select Gender
                        </option>
<option value="Male">
                            Male
                        </option>
<option value="Female">
                            Female
                        </option>
<option value="Other">
                            Other
                        </option>
</select>
<input id="username" placeholder="Username" required="" type="text"/>
<input id="email" placeholder="Email" required="" type="email"/>
<input id="password" placeholder="Password" required="" type="password"/>
<button class="create-button" type="submit">
                        Create account
                    </button>
</form>
<button class="back-button" id="backToLoginButton" type="button">
                    Already have an account? Log in
                </button>
<p class="result" id="registerResult"></p>
</div>
</div>
</div><script src="{{ url_for('static', filename='js/auth.js') }}"></script></body></html>
